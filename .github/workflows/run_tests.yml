name: Automated Test Suite

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: false
        default: 'chrome'
        type: choice
        options: [chrome, firefox]
      test_path:
        description: 'Test file or directory'
        required: false
        default: 'tests/generated/'
      test_branch:
        description: 'Branch containing generated test files'
        required: false
        default: 'e2etesting-anthropic'

  push:
    branches: [e2etesting-anthropic]
    paths:
      - 'tests/generated/**'

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout test branch (contains generated test files)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.test_branch || 'e2etesting-anthropic' }}

      - name: Checkout shared infrastructure from main
        run: |
          git fetch origin main
          git checkout origin/main -- requirements.txt tests/conftest.py tests/__init__.py || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-html pytest-json-report

      - name: Create reports directory
        run: mkdir -p reports/screenshots

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        if: ${{ inputs.browser != 'firefox' }}

      - name: List test files (debug)
        run: |
          echo "=== Branch: ${{ inputs.test_branch || 'e2etesting-anthropic' }} ==="
          echo "=== tests/generated/ contents ==="
          ls -la tests/generated/ || echo "Directory not found"

      - name: Run tests
        env:
          SELENIUM_BROWSER:  ${{ inputs.browser || 'chrome' }}
          SELENIUM_HEADLESS: 'true'
          SELENIUM_BASE_URL: ${{ secrets.SELENIUM_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pytest ${{ inputs.test_path || 'tests/generated/' }} \
            --html=reports/report.html \
            --self-contained-html \
            --json-report \
            --json-report-file=reports/report.json \
            -v \
            || true

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/
          retention-days: 14

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-screenshots
          path: reports/screenshots/
          retention-days: 7

      - name: Fail job if tests failed
        if: always()
        run: |
          if [ -f reports/report.json ]; then
            FAILED=$(python3 -c "import json; d=json.load(open('reports/report.json')); print(d.get('summary',{}).get('failed',0))")
            TOTAL=$(python3 -c "import json; d=json.load(open('reports/report.json')); print(d.get('summary',{}).get('total',0))")
            echo "Total: $TOTAL | Failed: $FAILED"
            if [ "$FAILED" -gt "0" ]; then
              echo "❌ $FAILED test(s) failed"
              exit 1
            else
              echo "✅ All $TOTAL tests passed"
            fi
          else
            echo "⚠️ No report.json found"
            exit 1
          fi
