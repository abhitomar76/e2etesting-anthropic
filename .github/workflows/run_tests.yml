name: Automated Test Suite

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: false
        default: 'chrome'
        type: choice
        options: [chrome, firefox]
      test_path:
        description: 'Test file or directory (default: all generated tests)'
        required: false
        default: 'tests/generated/'

  push:
    branches: [auto-tests]
    paths:
      - 'tests/generated/**'

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Ensure reporting plugins are installed regardless of requirements.txt
          pip install pytest-html pytest-json-report

      - name: Create reports directory
        run: mkdir -p reports/screenshots

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        if: ${{ inputs.browser != 'firefox' }}

      - name: Install Firefox
        uses: browser-actions/setup-firefox@v1
        if: ${{ inputs.browser == 'firefox' }}

      - name: Run tests
        env:
          SELENIUM_BROWSER:   ${{ inputs.browser || 'chrome' }}
          SELENIUM_HEADLESS:  'true'
          SELENIUM_BASE_URL:  ${{ secrets.SELENIUM_BASE_URL }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pytest ${{ inputs.test_path || 'tests/generated/' }} \
            --html=reports/report.html \
            --self-contained-html \
            --json-report \
            --json-report-file=reports/report.json \
            -v \
            || true  # Don't fail the step on test failures — let upload happen first

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/
          retention-days: 14

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-screenshots
          path: reports/screenshots/
          retention-days: 7

      - name: Fail job if tests failed
        if: always()
        run: |
          if [ -f reports/report.json ]; then
            FAILED=$(python3 -c "import json; d=json.load(open('reports/report.json')); print(d.get('summary',{}).get('failed',0))")
            if [ "$FAILED" -gt "0" ]; then
              echo "❌ $FAILED test(s) failed"
              exit 1
            else
              echo "✅ All tests passed"
            fi
          fi
